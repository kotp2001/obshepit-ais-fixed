{% extends 'base.html' %}
{% block title %}Вход в систему{% endblock %}
{% block content %}

<style>
    /* Стили для формы смены пароля */
    .password-change-form {
        display: none;
        margin-top: 20px;
        padding: 20px;
        background: rgba(255,255,255,0.05);
        border-radius: 10px;
        border: 1px solid rgba(255,215,0,0.2);
    }
    .password-change-form.active {
        display: block;
    }
    .toggle-link {
        cursor: pointer;
        color: #ffd700;
        text-decoration: underline;
    }
    .toggle-link:hover {
        color: #e6c200;
    }
    .error-message {
        color: #ff6b6b;
        background: rgba(255,0,0,0.1);
        padding: 10px;
        border-radius: 5px;
        margin-bottom: 15px;
        display: none;
    }
    .success-message {
        color: #51cf66;
        background: rgba(0,255,0,0.1);
        padding: 10px;
        border-radius: 5px;
        margin-bottom: 15px;
        display: none;
    }
</style>

<div class="fade-in">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center mb-4">
            <h1 class="display-3 fw-bold" style="color: #ffd700;">АИС Общепит</h1>
            <p class="lead text-white">Система автоматизации для ресторана, кафе, столовой</p>
            <p class="text-white">Вход только для сотрудников</p>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-4">
            <!-- БЛОК ВХОДА -->
            <div class="card" id="loginBlock">
                <div class="card-header" style="background: rgba(20,20,50,0.9); text-align: center;">
                    <h5 class="mb-0" style="color: #ffd700;">Вход в систему</h5>
                </div>
                <div class="card-body">
                    <!-- Сообщение об ошибке входа -->
                    <div id="login-error" class="alert alert-danger" style="display: none;"></div>
                    
                    <div class="form-group mb-3">
                        <label class="form-label" style="color: white;">Логин</label>
                        <input type="text" id="login-username" class="form-control" placeholder="Введите логин" value="admin">
                    </div>
                    <div class="form-group mb-3">
                        <label class="form-label" style="color: white;">Пароль</label>
                        <input type="password" id="login-password" class="form-control" placeholder="Введите пароль" value="admin123">
                    </div>
                    <button class="btn btn-warning w-100" onclick="employeeLogin()" style="background: #ffd700; color: #1a1a4a;">Войти</button>
                    
                    <div class="text-center mt-3">
                        <span class="toggle-link" onclick="togglePasswordForm()">Сменить пароль</span>
                    </div>
                </div>
            </div>

            <!-- БЛОК СМЕНЫ ПАРОЛЯ -->
            <div class="card password-change-form" id="passwordChangeBlock">
                <div class="card-header" style="background: rgba(20,20,50,0.9); text-align: center;">
                    <h5 class="mb-0" style="color: #ffd700;">Смена пароля</h5>
                </div>
                <div class="card-body">
                    <!-- Сообщения об ошибке/успехе -->
                    <div id="pass-error" class="alert alert-danger" style="display: none;"></div>
                    <div id="pass-success" class="alert alert-success" style="display: none;"></div>
                    
                    <div class="form-group mb-3">
                        <label class="form-label" style="color: white;">Логин</label>
                        <input type="text" id="change-username" class="form-control" placeholder="Введите логин" value="admin">
                    </div>
                    <div class="form-group mb-3">
                        <label class="form-label" style="color: white;">Текущий пароль</label>
                        <input type="password" id="change-old-password" class="form-control" placeholder="Введите текущий пароль">
                    </div>
                    <div class="form-group mb-3">
                        <label class="form-label" style="color: white;">Новый пароль</label>
                        <input type="password" id="change-new-password" class="form-control" placeholder="Введите новый пароль">
                    </div>
                    <div class="form-group mb-3">
                        <label class="form-label" style="color: white;">Подтверждение пароля</label>
                        <input type="password" id="change-confirm-password" class="form-control" placeholder="Подтвердите новый пароль">
                    </div>
                    <button class="btn btn-success w-100" onclick="changePassword()" style="background: #28a745; color: white;">Сохранить новый пароль</button>
                    
                    <div class="text-center mt-3">
                        <span class="toggle-link" onclick="togglePasswordForm()">Вернуться ко входу</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // 1. ПЕРЕКЛЮЧЕНИЕ МЕЖДУ ФОРМАМИ ВХОДА И СМЕНЫ ПАРОЛЯ
    // ============================================================
    function togglePasswordForm() {
        const loginBlock = document.getElementById('loginBlock');
        const passBlock = document.getElementById('passwordChangeBlock');
        
        if (passBlock.classList.contains('active')) {
            // Скрываем форму смены пароля, показываем вход
            passBlock.classList.remove('active');
            loginBlock.style.display = 'block';
        } else {
            // Показываем форму смены пароля, скрываем вход
            passBlock.classList.add('active');
            loginBlock.style.display = 'none';
        }
    }

    // ============================================================
    // 2. АВТОРИЗАЦИЯ
    // ============================================================
    async function employeeLogin() {
        const username = document.getElementById('login-username').value;
        const password = document.getElementById('login-password').value;
        const errorDiv = document.getElementById('login-error');
        
        if (!username || !password) {
            showError(errorDiv, 'Введите логин и пароль');
            return;
        }
        
        try {
            const response = await fetch('/api/login/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: username, password: password })
            });
            const data = await response.json();
            
            if (data.success) {
                localStorage.setItem('user_role', data.role);
                localStorage.setItem('user_name', data.username);
                
                if (data.role === 'admin') {
                    window.location.href = '/admin-panel/';
                } else if (data.role === 'waiter') {
                    window.location.href = '/waiter/';
                } else if (data.role === 'chef') {
                    window.location.href = '/kitchen/';
                } else {
                    window.location.href = '/';
                }
            } else {
                showError(errorDiv, data.error || 'Неверный логин или пароль');
            }
        } catch (error) {
            showError(errorDiv, 'Ошибка соединения с сервером');
        }
    }

    function showError(element, message) {
        element.innerHTML = message;
        element.style.display = 'block';
        setTimeout(() => {
            element.style.display = 'none';
        }, 5000);
    }

    // ============================================================
    // 3. СМЕНА ПАРОЛЯ (отправка на /api/change-password/)
    // ============================================================
    async function changePassword() {
        const username = document.getElementById('change-username').value;
        const oldPass = document.getElementById('change-old-password').value;
        const newPass = document.getElementById('change-new-password').value;
        const confirmPass = document.getElementById('change-confirm-password').value;
        
        const errorDiv = document.getElementById('pass-error');
        const successDiv = document.getElementById('pass-success');
        
        // Скрываем старые сообщения
        errorDiv.style.display = 'none';
        successDiv.style.display = 'none';
        
        // Валидация
        if (!username || !oldPass || !newPass || !confirmPass) {
            showError(errorDiv, 'Заполните все поля');
            return;
        }
        
        if (newPass.length < 6) {
            showError(errorDiv, 'Новый пароль должен содержать минимум 6 символов');
            return;
        }
        
        if (newPass !== confirmPass) {
            showError(errorDiv, 'Пароли не совпадают');
            return;
        }
        
        try {
            const response = await fetch('/api/change-password/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: username,
                    old_password: oldPass,
                    new_password: newPass
                })
            });
            const data = await response.json();
            
            if (data.success) {
                successDiv.innerHTML = 'Пароль успешно изменён! Теперь войдите с новым паролем.';
                successDiv.style.display = 'block';
                
                // Очищаем поля
                document.getElementById('change-old-password').value = '';
                document.getElementById('change-new-password').value = '';
                document.getElementById('change-confirm-password').value = '';
                
                // Через 2 секунды переключаемся обратно на форму входа
                setTimeout(() => {
                    togglePasswordForm();
                    document.getElementById('login-password').value = '';
                    successDiv.style.display = 'none';
                }, 2500);
            } else {
                showError(errorDiv, data.error || 'Ошибка смены пароля');
            }
        } catch (error) {
            showError(errorDiv, 'Ошибка соединения с сервером');
        }
    }
</script>

{% endblock %}
