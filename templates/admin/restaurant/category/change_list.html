<!--

    Назначение: страница управления категориями меню в панели администратора.
    Изменения по сравнению со стандартным change_list:
        
-->

{% extends "admin/change_list.html" %}
{% load i18n admin_urls static admin_list %}

{% block extrastyle %}
    {{ block.super }}
    <style>
        /* === Скрываем кнопку "Добавить категорию" === */
        .object-tools {
            display: none !important;
        }

        /* === Скрываем столбец с чекбоксами (белые квадраты слева) === */
        .action-checkbox-column {
            display: none !important;
        }
        .action-checkbox-column input[type="checkbox"] {
            display: none !important;
        }
        td.action-checkbox {
            display: none !important;
        }

        /* === Скрываем блок "Действие" (выпадающее меню и кнопка "Выполнить") === */
        .actions {
            display: none !important;
        }

        /* === Дополнительно: компактная таблица (опционально) === */
        #result_list td, #result_list th {
            padding: 8px 10px;
        }
        .results {
            margin-top: 5px;
        }
    </style>
{% endblock %}

{% block object-tools %}
    {# Переопределяем блок object-tools, чтобы ничего не выводить #}
{% endblock %}

{% block extrahead %}
    {{ block.super }}
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // === Скрываем панель с действиями (на случай, если CSS не сработал) ===
            var actions = document.querySelector('.actions');
            if (actions) {
                actions.style.display = 'none';
            }

            // === Скрываем столбец с чекбоксами ===
            var checkboxes = document.querySelectorAll('.action-checkbox');
            checkboxes.forEach(function(el) {
                el.style.display = 'none';
            });
            var headerCheck = document.querySelector('.action-checkbox-column');
            if (headerCheck) {
                headerCheck.style.display = 'none';
            }

            // === Скрываем кнопку "Добавить категорию" ===
            var addBtn = document.querySelector('.addlink');
            if (addBtn) {
                addBtn.style.display = 'none';
            }
        });
    </script>
{% endblock %}
