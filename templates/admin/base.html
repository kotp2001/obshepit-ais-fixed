{% extends "admin/base.html" %}
{% load static %}

{% block extrastyle %}
{{ block.super }}
<style>
    /* ===== ФОН КАК НА ОСНОВНОМ САЙТЕ ===== */
    body {
        background: linear-gradient(135deg, #0a0a2a 0%, #1a1a4a 50%, #0a0a2a 100%) !important;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        min-height: 100vh;
        margin: 0;
        padding: 0;
    }
    /* Контейнер админки — прозрачный фон, чтобы был виден градиент */
    #container {
        background: rgba(30, 30, 70, 0.6) !important;
        backdrop-filter: blur(8px) !important;
        border-radius: 15px;
        margin: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3) !important;
        border: 1px solid rgba(255, 215, 0, 0.2) !important;
        color: white;
    }
    /* Шапка админки */
    #header {
        background: linear-gradient(135deg, #0a0a2a 0%, #1a1a4a 100%) !important;
        border-bottom: 3px solid #ffd700 !important;
        border-radius: 15px 15px 0 0 !important;
        padding: 15px 20px;
    }
    #branding h1 {
        color: #ffd700 !important;
    }
    #branding h1 a {
        color: #ffd700 !important;
    }
    #user-tools {
        color: #ffd700 !important;
    }
    #user-tools a {
        color: #ffd700 !important;
    }
    /* Боковое меню (если используется) */
    .module h2, .inline-group h2 {
        background: rgba(26, 26, 74, 0.9) !important;
        color: #ffd700 !important;
        border-radius: 8px;
        padding: 10px 15px;
        border: 1px solid rgba(255, 215, 0, 0.2);
    }
    .module caption {
        background: rgba(10, 10, 42, 0.9) !important;
        color: #ffd700 !important;
    }
    /* Таблицы */
    .results {
        background: rgba(30, 30, 70, 0.3) !important;
        border-radius: 10px;
        border: 1px solid rgba(255, 215, 0, 0.1) !important;
    }
    .results th {
        background: rgba(26, 26, 74, 0.9) !important;
        color: #ffd700 !important;
    }
    .results td {
        background: rgba(40, 40, 90, 0.4) !important;
        color: white !important;
        border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .results tr:hover td {
        background: rgba(60, 60, 110, 0.6) !important;
    }
    /* Кнопки */
    .button, input[type=submit], input[type=button], .submit-row input, a.button {
        background: #ffd700 !important;
        color: #1a1a4a !important;
        border-radius: 20px;
        padding: 8px 20px;
        font-weight: 600;
        border: none;
        transition: all 0.1s ease;
        cursor: pointer;
    }
    .button:hover, input[type=submit]:hover, input[type=button]:hover, .submit-row input:hover, a.button:hover {
        background: #e6c200 !important;
        transform: translateY(-1px);
    }
    .button:active, input[type=submit]:active, input[type=button]:active, .submit-row input:active {
        transform: translateY(1px);
    }
    .default {
        background: #1a1a4a !important;
        color: white !important;
    }
    .default:hover {
        background: #2a2a5a !important;
    }
    /* Поля ввода */
    input, textarea, select {
        background: rgba(50, 50, 100, 0.8) !important;
        border: 1px solid rgba(255, 255, 255, 0.2) !important;
        color: white !important;
        border-radius: 10px;
        padding: 8px 12px;
    }
    input:focus, textarea:focus, select:focus {
        border-color: #ffd700 !important;
        outline: none;
        box-shadow: 0 0 5px rgba(255, 215, 0, 0.3);
    }
    label {
        color: #ffd700 !important;
    }
    /* Хлебные крошки */
    div.breadcrumbs {
        background: rgba(26, 26, 74, 0.8) !important;
        color: #ffd700 !important;
        padding: 10px 15px;
        border-radius: 10px;
        margin-bottom: 20px;
        border: 1px solid rgba(255, 215, 0, 0.2);
    }
    div.breadcrumbs a {
        color: #ffd700 !important;
    }
    /* Пагинация */
    .paginator {
        background: rgba(40, 40, 90, 0.6) !important;
        color: white !important;
        border-radius: 10px;
        padding: 10px;
        margin-top: 15px;
    }
    .paginator a {
        color: #ffd700 !important;
    }
    /* Сообщения об успехе/ошибке */
    .messagelist li {
        border-radius: 10px;
        padding: 10px;
    }
    .success {
        background: rgba(40, 167, 69, 0.2) !important;
        border: 1px solid #28a745 !important;
        color: #28a745 !important;
    }
    .error {
        background: rgba(220, 53, 69, 0.2) !important;
        border: 1px solid #dc3545 !important;
        color: #dc3545 !important;
    }
    /* Футер */
    #footer {
        background: rgba(10, 10, 42, 0.9) !important;
        color: #ffd700 !important;
        text-align: center;
        padding: 15px;
        margin-top: 20px;
        border-top: 1px solid rgba(255, 215, 0, 0.3);
        border-radius: 15px;
    }
    /* Ссылки */
    a:link, a:visited {
        color: #ffd700 !important;
    }
    a:hover {
        color: #e6c200 !important;
    }
    /* Фильтры (если они появятся) – делаем прозрачными */
    #changelist-filter {
        background: rgba(20, 20, 50, 0.7) !important;
        backdrop-filter: blur(10px) !important;
        border-radius: 15px !important;
        padding: 15px;
        border: 1px solid rgba(255, 215, 0, 0.2) !important;
    }
    #changelist-filter h2, #changelist-filter h3 {
        color: #ffd700 !important;
    }
    #changelist-filter a {
        color: white !important;
    }
    #changelist-filter a:hover {
        color: #ffd700 !important;
    }
    /* Страница подтверждения удаления */
    .delete-confirmation .module {
        background: rgba(30, 30, 70, 0.4) !important;
        border-radius: 15px !important;
        border: 1px solid rgba(255, 215, 0, 0.2) !important;
    }
    .delete-confirmation .module h2 {
        background: rgba(26, 26, 74, 0.9) !important;
        color: #ffd700 !important;
    }
    .delete-confirmation .module ul {
        background: rgba(40, 40, 90, 0.4) !important;
        color: white !important;
    }
    .delete-confirmation .module ul li {
        color: white !important;
    }
    /* Скрываем стандартные кнопки переключения темы (если есть) */
    .theme-toggle {
        display: none !important;
    }
    /* Дополнительно: рамки и границы */
    .module {
        background: transparent !important;
        border: none !important;
    }
    .module .results {
        background: rgba(30, 30, 70, 0.3) !important;
    }
    /* Стиль для кнопки "Да, я уверен" (удаление) */
    .delete-confirmation .submit-row input[type="submit"] {
        background: #dc3545 !important;
        color: white !important;
    }
    .delete-confirmation .submit-row input[type="submit"]:hover {
        background: #c82333 !important;
    }
    .delete-confirmation .submit-row input[type="submit"]:active {
        transform: translateY(1px);
    }
</style>
{% endblock %}

{% block extrahead %}
{{ block.super }}
<!-- Звёздное небо -->
<style>
    /* Фиксированные звёзды */
    .stars {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: -1;
    }
    .star {
        position: absolute;
        background: white;
        border-radius: 50%;
        opacity: 0;
        animation: twinkle 3s ease-in-out infinite;
    }
    @keyframes twinkle {
        0%, 100% { opacity: 0; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.2); }
    }
</style>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        function createStars() {
            const starsContainer = document.createElement('div');
            starsContainer.className = 'stars';
            document.body.appendChild(starsContainer);
            for (let i = 0; i < 200; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.width = Math.random() * 3 + 'px';
                star.style.height = star.style.width;
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 5 + 's';
                star.style.animationDuration = 2 + Math.random() * 3 + 's';
                starsContainer.appendChild(star);
            }
        }
        createStars();
    });
</script>
{% endblock %}
